syntax = "proto3";
package com.kodypay.grpc.pay.v1;
option java_multiple_files = true;
option java_outer_classname = "KodyPayTerminalProto";
option java_package = "com.kodypay.grpc.pay.v1";
import "google/protobuf/timestamp.proto";

service KodyPayTerminalService {
  rpc Terminals(TerminalsRequest) returns (TerminalsResponse);
  rpc Pay(PayRequest) returns (stream PayResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc PaymentDetails(PaymentDetailsRequest) returns (PayResponse);
  rpc Refund(RefundRequest) returns (stream RefundResponse);
  rpc Void(VoidPaymentRequest) returns (VoidPaymentResponse);
  rpc CloseBatch(CloseBatchRequest) returns (CloseBatchResponse);
}

// Request message for closing batches
// requires X-API-Key header with 'API Key' value
message CloseBatchRequest {
  string store_id = 1;              // Required: Store identifier
  repeated string terminal_ids = 2;   // Optional: Terminal identifier
}

// Response message for batch closure operation
message CloseBatchResponse {
  CloseBatchStatus status = 1;        // Overall status: "success", "partial_success", "failure"
  string message = 2;                // Descriptive message
  repeated CloseBatchResult results = 3;  // Results for each batch closure attempt

  enum CloseBatchStatus {
    SUCCESS = 0;          // Batch initiated closure successfully
    PARTIAL_SUCCESS = 1;  // Some batches initiated closure successfully, others failed
    FAILURE = 2;          // All batch closure attempts failed
  }
}

// Individual batch closure result
message CloseBatchResult {
  string terminal_id = 1;            // Terminal that owned the batch
  int32 batch_id = 2;                // batch identifier
  bool success = 3;                  // Whether this closure initiation was successful
  string message = 4;                // Success or error message for this batch
}

// requires X-API-Key header with 'API Key' value
message TerminalsRequest {
  string store_id = 1; // UUID of store
}
message TerminalsResponse {
  repeated Terminal terminals = 1;
}
message Terminal {
  string terminal_id = 1; // terminal serial number
  bool online = 2;
}

// requires X-API-Key header with 'API Key' value
message PayRequest {
  string store_id = 1; // UUID of store
  string amount = 2; // total amount in BigDecimal/2.dp (0.00)
  string terminal_id = 3; // send the payment to this terminal serial number
  optional bool show_tips = 4; // Show tips on the terminal
  optional PaymentMethod payment_method = 5; // Choose specific payment method on the terminal. If not set the terminal will request on the screen to select the payment method
  optional string idempotency_uuid = 6; // UUID idempotency key. Can be generated by client.
  optional string payment_reference = 7; // Unique payment reference provided by client
  optional string order_id = 8; // Unique order reference provided by client
  repeated PaymentMethods accepts_only = 9; // An inclusion list of accepted payment methods. If empty, all payment methods are accepted.
  optional string tips_amount = 10; // tips amount in BigDecimal/2.dp (0.00), it should be included in the total amount.

  enum PaymentMethods {
    VISA = 0;
    MASTERCARD = 1;
    AMEX = 2;
    BAN_CONTACT = 3;
    CHINA_UNION_PAY = 4;
    MAESTRO = 5;
    DINERS = 6;
    DISCOVER = 7;
    JCB = 8;
    ALIPAY = 9;
    WECHAT = 10;
    PAYME = 11;
  }
}

message PaymentMethod {
  optional PaymentMethodType payment_method_type = 1; // Payment method type
  oneof verification_mode {
    string token = 2; // With the token present QR scanning is skipped and goes straight to the payment screen.
    bool activate_qr_code_scanner = 3; // Flag to activate the terminal camera to scan the customer's or Kody's QR Code (true), or display the payment method type QR Code for the user to scan (false, default).```
  }
}

enum PaymentMethodType {
  CARD = 0;
  E_WALLET = 1;
  UNKNOWN = 2; //Only used for response(Used to indicate a situation when the payment method cannot be recognized)
}

message PayResponse {
  PaymentStatus status = 1;
  optional string failure_reason = 2; // only populated on failure
  optional string receipt_json = 3 [deprecated = true]; // replaced by payment_data.receipt_json
  string payment_id = 4;
  google.protobuf.Timestamp date_created = 5;
  optional string psp_reference = 6 [deprecated = true]; // replaced by payment_data.psp_reference;
  google.protobuf.Timestamp date_paid = 7 [deprecated = true]; // replaced by payment_data.date_paid
  optional string total_amount = 8 [deprecated = true]; // replaced by payment_data.total_amount
  optional string sale_amount = 9 [deprecated = true]; // replaced by payment_data.sale_amount
  optional string tips_amount = 10 [deprecated = true]; // replaced by payment_data.tips_amount
  optional PaymentData payment_data = 11;
  optional string payment_reference = 12;
  optional string order_id = 13;
  repeated PayRequest.PaymentMethods accepts_only = 14;
  optional bool is_payment_declined = 15; // Field to be able to differentiate cancelled from declined, for Oracle use, without breaking backwards compatibility.
  repeated RefundDetails refunds = 16;
  optional bool is_payment_captured = 17; // For payments that are not AUTO_CAPTURE, it is necessary to determine whether they have been captured based on this field.
  // How much of the payment has been refunded, counting only refunds that succeeded. Server-derived
  // from the same rows as `refunds`, so the two cannot disagree. A BigDecimal/2.dp string, following
  // this service's convention rather than ecom's minor units.
  optional string amount_refunded = 18;
  // True only when the whole payment has been refunded. False while partially refunded.
  optional bool fully_refunded = 19;

  message PaymentData {
    google.protobuf.Timestamp date_paid = 1;
    string total_amount = 2;
    string sale_amount = 3;
    string tips_amount = 4;
    string receipt_json = 5; // json blob containing the receipt data
    string psp_reference = 6;
    PaymentMethodType payment_method_type = 7;
    string payment_method = 8; // Payment method. e.g., visa, mc, amex, etc.
    optional PaymentCard payment_card = 9;
    optional string payment_method_variant = 10; // Payment method variant. e.g., mc, mcsuperpremiumcredit, visa, visadebit, visacredit, etc.
    optional string refund_amount = 11 [deprecated = true]; // replaced by RefundDetails.refund_amount
    optional string original_currency = 12; // The currency that applies to total_amount, sale_amount, and tips_amount. Defined by the store’s configured settlement currency.
    optional string paid_amount = 13; // The amount paid by the customer. This will differ from total_amount if the customer pays in their home currency.
    optional string paid_currency = 14; // The currency in which the customer paid. This will differ from original_currency if the customer pays in their home currency.
    optional string exchange_rate = 15; // The exchange rate from original_currency to paid_currency, with up to 6 decimal places
    optional string batch_id = 16; // Only used for batch payments

    message PaymentCard {
      string card_last_4_digits = 1;
      string card_expiry_date = 2;
      string pos_entry_mode = 3;
      string payment_token = 4;
      string auth_code = 5;
      optional string card_bin = 6; // The first 6 digits of the card number, used to identify the issuer
      optional string card_issuing_bank = 7; // Issuing bank name, e.g., STANDARD CHARTERED BANK (HONG KONG) LTD
      optional string funding_source = 8; // The funding source of the customer’s card, e.g., CREDIT, DEBIT, or PREPAID.
    }
  }

  message RefundDetails {
    string payment_id = 1;
    optional string refund_psp_reference = 2; // Might not have a PSP yet reference if pending
    string payment_transaction_id = 3;        // This refund's own id. Use it to identify this refund.
    string refund_amount = 4;
    google.protobuf.Timestamp event_date = 5;
    optional string terminal_id = 6;
    // Whether this refund completed. The list previously carried no status at all, so a caller could
    // only guess from whether refund_psp_reference was set — which says the acquirer accepted it, not
    // that it succeeded.
    Refund.Status status = 7;
  }
}

// A refund's own lifecycle, which is not the payment's: the payment stays successful throughout.
// Carried only on PayResponse.refunds[].status — a surface that did not exist before, so there is no
// older field beside it saying something different. Nested so the values keep short names: proto enum
// values are siblings of their type within the package, and PaymentStatus already occupies PENDING,
// FAILED and CANCELLED there.
message Refund {
  enum Status {
    UNSPECIFIED = 0;  // Never sent deliberately; a legal fallback rather than an illegal one.
    PENDING = 1;      // Not yet sent to the acquirer.
    REQUESTED = 2;    // The acquirer accepted the refund request. Not yet money back.
    SUCCEEDED = 3;    // The refund completed.
    FAILED = 4;       // The acquirer rejected or failed it.
    CANCELLED = 5;    // The payment was voided instead, so the payer was never charged.
  }
}

// Frozen with respect to refund outcomes: adding values here would change what every existing
// integrator sees on this field. Whether a payment has been refunded, and by how much, is in
// PayResponse.refunds.
enum PaymentStatus {
  PENDING = 0;
  SUCCESS = 1;
  FAILED = 2;
  CANCELLED = 3;
  DECLINED = 4;
  // Deprecated: refund state does not belong on the payment's status — the payment stays successful
  // whether or not it was later refunded. These two predate that decision and are still emitted for
  // compatibility. Read `refunds` and `amount_refunded` instead.
  REFUND_PENDING = 5 [deprecated = true];
  REFUND_REQUESTED = 6 [deprecated = true];
}

// requires X-API-Key header with 'API Key' value
message CancelRequest {
  string store_id = 1; // UUID of store
  string amount = 2; // amount in BigDecimal/2.dp (0.00) - to identify the payment to cancel
  string terminal_id = 3; // to identify the terminal where the payment was sent
  optional string payment_id = 4; // to identify the payment (order) to cancel
}
message CancelResponse {
  PaymentStatus status = 1;
}

// requires X-API-Key header with 'API Key' value
message PaymentDetailsRequest {
  string store_id = 1; // UUID of store
  string order_id = 2; // payment_id returned in the payment response, to identify the payment (order)
}

// requires X-API-Key header with 'API Key' value
message RefundRequest {
  string store_id = 1; // UUID of store
  string payment_id = 2;
  string amount = 3; // amount in BigDecimal/2.dp (0.00)
  optional string idempotency_uuid = 4; // UUID idempotency key. Will be generated by client.
  optional string terminal_id = 5;
  optional string ext_pay_reference = 6;
  optional string ext_order_id = 7;
}
message RefundResponse {
  RefundStatus status = 1;
  optional string failure_reason = 2; // only populated on failure
  string payment_id = 3; // The payment that was refunded.
  google.protobuf.Timestamp date_created = 4;
  string total_paid_amount = 5;
  string total_amount_refunded = 6;
  string remaining_amount = 7;
  string total_amount_requested = 8;
  string paymentTransactionId = 9; // This refund's own id — not the payment's. Empty on the interim PENDING message, since the refund does not exist yet.
  // Whether the refund REQUEST was accepted — which is all this response can say. Adyen's synchronous
  // refund response carries `status: received` and nothing more; the outcome arrives later. Read the
  // refund's own state from PaymentDetails.refunds[].status (ecom) / PayResponse.refunds[].status.
  enum RefundStatus {
    PENDING = 0;
    REQUESTED = 1;    // Accepted by the acquirer. NOT money back yet.
    FAILED = 2;       // Rejected outright.
  }
  optional string order_id = 10;
  optional string ext_pay_reference = 11;
  optional string ext_order_id = 12;
}

message VoidPaymentRequest {
  // Voiding by psp_reference is no longer supported: removed 2026-09-05 after 90 days with no request
  // using it. A request that still sets it now carries no identifier and is rejected rather than
  // voiding anything. Field 1 and the name stay reserved so neither can be reused for something else.
  reserved 1;
  reserved "psp_reference";
  // Kept as a oneof with one member: exactly one identifier, and room for another later without
  // changing the shape of the generated code.
  oneof ids {
    string payment_id = 2;
  }
  optional string payment_reference = 3 ;
  optional string order_id = 4;
  string store_id = 5;
}

message VoidPaymentResponse {
  string psp_reference = 1;
  string payment_id = 2;
  VoidStatus status = 3;
  optional SaleData sale_data = 4;
  google.protobuf.Timestamp date_voided = 5;

  enum VoidStatus {
    PENDING = 0;
    REQUESTED = 1;
    VOIDED = 2;
    FAILED = 3;
  }

  message SaleData {
    string total_amount = 1;
    string sale_amount = 2;
    string tips_amount = 3;
    string order_id = 4;
    string payment_reference = 5;
  }
}
