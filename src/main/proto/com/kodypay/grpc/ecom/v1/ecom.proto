syntax = "proto3";
package com.kodypay.grpc.ecom.v1;
option java_multiple_files = true;
option java_outer_classname = "KodyEcomPaymentsProto";
option java_package = "com.kodypay.grpc.ecom.v1";
import "google/protobuf/timestamp.proto";

// All service requests require X-API-Key header with 'API Key' value
service KodyEcomPaymentsService {
  // Initiates a payment and returns a URL for the user to complete payment
  rpc InitiatePayment(PaymentInitiationRequest) returns (PaymentInitiationResponse);
  rpc InitiatePaymentStream(PaymentInitiationRequest) returns (stream PaymentDetailsResponse);
  rpc PaymentDetails(PaymentDetailsRequest) returns (PaymentDetailsResponse);
  rpc PaymentDetailsStream(PaymentDetailsRequest) returns (stream PaymentDetailsResponse);
  rpc GetPayments(GetPaymentsRequest) returns (GetPaymentsResponse);
  // Transaction-level Sales reporting data for one store: the same rows, and the same value in
  // every field, as Kody Universe > Sales > Transactions > Download.
  //
  // Reaches back three completed calendar days and no further, evaluated in the store's own
  // timezone: asked on 18 September it can report 15, 16 or 17 September - never the 18th, which is
  // still in progress. Filter to one of those days, or omit the filter for all three. Paging runs
  // within whatever was selected and never reaches outside it.
  rpc GetPaymentTransactionList(GetPaymentTransactionListRequest) returns (GetPaymentTransactionListResponse);
  rpc Refund(RefundRequest) returns (stream RefundResponse);
  rpc CreateCardToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc GetCardToken(GetCardTokenRequest) returns (GetCardTokenResponse);
  rpc DeleteCardToken(DeleteCardTokenRequest) returns (DeleteCardTokenResponse);
  rpc GetCardTokens(GetCardTokensRequest) returns (GetCardTokensResponse);
  rpc PayWithCardToken(PayWithCardTokenRequest) returns (PaymentDetailsResponse);
  rpc GetTokenPaymentDetails(PaymentDetailsRequest) returns (PaymentDetailsResponse);
}

// Payment Initiation Request
message PaymentInitiationRequest {
  string store_id = 1; // Your Kody store id
  string payment_reference = 2; // Your unique reference of this payment request.
  uint64 amount_minor_units = 3; // Amount in minor units. For example, 2000 means GBP 20.00.
  string currency = 4; // ISO 4217 three letter currency code
  string order_id = 5; // Your identifier of the order. It doesn't have to be unique, for example when the same order has multiple payments.
  optional string order_metadata = 6; // Not implemented. A data set that can be used to store information about the order and used in the payment details. For example a JSON with checkout items. It will be useful as evidence to challenge chargebacks or any risk data.
  string return_url = 7; // The URL that your client application will be redirected to after the payment is authorised. You can include additional query parameters, for example, the user id or order reference.
  optional string payer_statement = 8; // The text to be shown on the payer's bank statement. Maximum 22 characters, otherwise banks might truncate the string. If not set it will use the store's terminals receipt printing name. Allowed characters: a-z, A-Z, 0-9, spaces, and special characters . , ' _ - ? + * /
  optional string payer_email_address = 9; // We recommend that you provide this data, as it is used in velocity fraud checks. Required for 3D Secure 2 transactions.
  optional string payer_ip_address = 10; // The payer IP address used for risk checks, also required for 3D Secure 2 transactions.
  optional string payer_locale = 11; // The language code and country code to specify the language to display the payment pages. It will default to en_GB if not set.
  optional bool tokenise_card = 12; // If true, tokenises the card used for this payment so it can be reused via PayWithCardToken. Requires payer_reference to be set. Defaults to false.
  optional ExpirySettings expiry = 13; // Nested message for expiry settings
  optional CaptureOptions capture_options = 14 [deprecated=true]; // Deprecated: capture/release options are no longer supported.
  optional bool is_pay_by_bank_accepted = 15; // Whether the payer can pay via pay by bank (Kody store must have pay by bank configured)
  repeated PaymentMethods accepts_only = 16; // An inclusion list of accepted payment methods. If empty, all payment methods are accepted.
  optional string payer_reference = 17; // The payer for whom the token is being created. This can be a user ID or any unique identifier you use to track users. Required when tokenise_card is true.
  optional RecurringProcessingModel recurring_processing_model = 18; // The recurring model to use when tokenise_card is true. Can be 'Subscription', 'UnscheduledCardOnFile' or 'CardOnFile'.
  optional string idempotency_uuid = 19; // Idempotency key to ensure the request is processed only once, generated by client. Required when tokenise_card is true.

  message ExpirySettings {
    bool show_timer = 1; // Display a countdown timer to the user in the payment page, default is false
    uint64 expiring_seconds = 2; // Timeout duration in seconds, defaults to 1800 seconds (30 minutes)
  }

  message CaptureOptions {
    option deprecated = true; // Deprecated: capture/release options are no longer supported.

    CaptureSettings capture_settings = 1;
    optional ReleaseSettings release_settings = 2;

    message CaptureSettings {
      bool delayed_capture = 1; // If true, the capture will be delayed until manually triggered. Default is false
      optional int32 auto_capture_interval_mins = 2; // Automatically capture the payment after the specified interval in minutes
      bool auto_capture_store_close_time = 3; // Automatically capture the payment at the store's closing time
    }

    message ReleaseSettings { // if not set, the funds will be released automatically by the card issuer
      bool delayed_release = 1; // If true, the release of funds will be delayed until manually triggered
      optional int32 auto_release_interval_mins = 2; // Automatically release the funds after the specified interval in minutes
      bool auto_release_store_close_time = 3; // Automatically release the funds at the store's closing time
    }
  }
}

// Payment Initiation Response
message PaymentInitiationResponse {
  oneof result {
    Response response = 1;
    Error error = 2;
  }

  message Response {
    string payment_id = 1; // The unique identifier created by Kody
    string payment_url = 2; // The URL to send the user to from your application
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      DUPLICATE_ATTEMPT = 1;
      INVALID_REQUEST = 2;
    }
  }
}

message PaymentDetailsRequest {
  string store_id = 1; // Your Kody store id
  oneof payment_identifier {
    string payment_id = 2; // The unique identifier created by Kody
    string payment_reference = 3; // Your unique payment reference that was set during the initiation
  }
}

message PaymentDetailsResponse {
  oneof result {
    PaymentDetails response = 1;
    Error error = 2;
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      NOT_FOUND = 1;
      INVALID_REQUEST = 2;
      DUPLICATE_ATTEMPT = 3;
    }
  }

  message PaymentDetails {
    string payment_id = 1; // The unique identifier created by Kody
    string payment_reference = 2 [deprecated=true]; // Your unique payment reference that was set during the initiation
    string order_id = 3 [deprecated=true]; // Your identifier of the order. It doesn't have to be unique, for example when the same order has multiple payments.
    optional string order_metadata = 4 [deprecated=true]; // A data set that can be used to store information about the order and used in the payment details. For example a JSON with checkout items. It will be useful as evidence to challenge chargebacks or any risk data.
    PaymentStatus status = 5;
    optional string payment_data_json = 6 [ deprecated = true ];

    google.protobuf.Timestamp date_created = 7;
    optional google.protobuf.Timestamp date_paid =8  [deprecated=true];
    optional string psp_reference = 9 [deprecated=true];
    optional string payment_method = 10[deprecated=true];

    optional PaymentData payment_data = 11; // PaymentData can be absent if payment has not been initiated
    optional SaleData sale_data = 12;
    // Every refund taken against this payment, oldest first. Empty when there are none.
    //
    // Not every endpoint returning this message populates the refund fields: GetPayments leaves them
    // unset. Use it to find payments, then read a payment's refunds with PaymentDetails. A repeated
    // field has no presence, so an empty list here cannot be told apart from a payment with no
    // refunds — the two aggregates below are optional so that they can be.
    repeated RefundDetails refunds = 13;
    // How much of the payment has been refunded, counting only refunds that succeeded. Server-derived
    // from the same rows as `refunds`, so the two cannot disagree.
    //
    // Optional so that "not reported" is distinguishable from "nothing refunded". Not every endpoint
    // returning PaymentDetails fills the refund fields in — see the field notes on `refunds` — and
    // without explicit presence an endpoint that does not would report 0 here, which reads as a
    // payment that was never refunded. Check presence before using it.
    optional uint64 amount_refunded_minor_units = 14;
    // True only when the whole payment has been refunded; false while it is partially refunded.
    //
    // Optional for the same reason as `amount_refunded_minor_units`: absent means the server did not
    // report it, not that the payment is unrefunded. Measured against the amount charged, so it is
    // also absent when that amount is unknown.
    optional bool fully_refunded = 15;
  }

  // One refund taken against the payment. Mirrors the terminal API's PayResponse.RefundDetails.
  message RefundDetails {
    string payment_transaction_id = 1;              // This refund's own id. Use it to identify this refund.
    optional string refund_psp_reference = 2;       // Absent until the acquirer has accepted the refund.
    string refund_amount = 3;                       // BigDecimal/2.dp (0.00)
    google.protobuf.Timestamp event_date = 4;
    Refund.Status status = 5;
  }

  // PaymentData message for the e-commerce domain.
  message PaymentData {
    string psp_reference = 1;
    // Explicit presence: zero is VISA, so check presence before reading. See the note on PaymentMethods.
    optional PaymentMethods payment_method = 2;
    string payment_method_variant = 3;
    PaymentAuthStatus auth_status =4;
    google.protobuf.Timestamp auth_status_date = 5; // The date and time of the auth status change.

    enum PaymentAuthStatus {
      PENDING = 0;
      AUTHORISED = 1;
      FAILED = 2;
      CAPTURED = 3;
      RELEASED = 4;
      EXPIRED = 5;
    }

    oneof payment_method_details {
      PaymentCard payment_card = 6;
      PaymentWallet payment_wallet = 7;
    }
    message PaymentCard{
      string card_last_4_digits =1;
      // The authorization code for the transaction.
      string auth_code =2;
      string payment_token = 3 [deprecated = true];
    }

    message PaymentWallet{
      optional string card_last_4_digits =1;
      string payment_link_id = 2;
    }
  }

  // SaleData message for the e-commerce domain.
  message SaleData {
    uint64 amount_minor_units = 1; // Amount in minor units. For example, 2000 means GBP 20.00.
    string currency = 2; // ISO 4217 three letter currency code
    string order_id = 3; // Your identifier of the order. It doesn't have to be unique, for example when the same order has multiple payments.
    string payment_reference = 4; // Your unique reference of this payment request.
    optional string order_metadata = 5; // A data set that can be used to store information about the order and used in the payment details. For example a JSON with checkout items. It will be useful as evidence to challenge chargebacks or any risk data.
  }
}

message GetPaymentsRequest {
  string store_id = 1;
  PageCursor page_cursor = 2;
  Filter filter = 3;

  message Filter {
    optional string order_id = 1;
    optional google.protobuf.Timestamp created_before = 2;
  }

  message PageCursor {
    int64 page = 1;
    int64 page_size = 2;
  }
}
message GetPaymentsResponse {
  oneof result {
    Response response = 1;
    Error error = 2;
  }

  message Response {
    repeated DeprecatedPaymentDetails deprecated_payments = 1 [deprecated = true];
    int64 total = 2;
    repeated PaymentDetailsResponse.PaymentDetails payments = 3 ;

    message DeprecatedPaymentDetails {
      string payment_id = 1; // The unique identifier created by Kody
      string payment_reference = 2; // Your unique payment reference that was set during the initiation
      string order_id = 3; // Your identifier of the order. It doesn't have to be unique, for example when the same order has multiple payments.
      optional string order_metadata = 4; // A data set that can be used to store information about the order and used in the payment details. For example a JSON with checkout items. It will be useful as evidence to challenge chargebacks or any risk data.
      PaymentStatus status = 5;
      optional string payment_data_json = 6; // json blob containing payment data

      google.protobuf.Timestamp date_created = 7;
      optional google.protobuf.Timestamp date_paid = 8;
      optional string psp_reference = 9;
      optional string payment_method = 10;
    }
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      NOT_FOUND = 1;
      INVALID_ARGUMENT = 2;
    }
  }
}

message GetPaymentTransactionListRequest {
  string store_id = 1; // Your Kody store id. The API key must be authorised for this store.
  PageCursor page_cursor = 2;
  // Omitted returns all three completed calendar days the endpoint allows.
  optional Filter filter = 3;

  message Filter {
    // The one calendar day to report, as an ISO 8601 / RFC 3339 full-date: "2026-09-16". Exactly
    // YYYY-MM-DD, zero-padded - no time, no offset, nothing else. A date, not an instant: there is
    // nothing to truncate and no timezone to disagree about. It is read in the store's configured
    // timezone and returns that whole day - 00:00:00 inclusive to 00:00:00 of the following day
    // exclusive. Unset returns all three days, the same as omitting the filter.
    //
    // It must be one of the three completed calendar days before today in that timezone. Today is
    // still in progress, so it is rejected, as are future dates and anything older than the window.
    // A date outside it, or not in exactly this format, is INVALID_ARGUMENT - never a date quietly
    // moved to the nearest allowed one, and never a leniently parsed "2026-9-16".
    //
    // The filter applies to the record's transaction date only; it never selects on settlement date.
    optional string transaction_date = 1;
  }

  message PageCursor {
    // The previous page's next_cursor. Unset or empty starts at the first page.
    //
    // A cursor is bound to the filter it was issued for: send it back with the same filter, or the
    // request is rejected. Paging happens after the day has been selected and cannot change which
    // day that is.
    optional string cursor = 1;
    // Rows per page, 1 to 1000; unset means 100. Page size limits how many rows come back and
    // nothing else - it never reaches outside the selected day.
    optional int64 page_size = 2;
  }
}

message GetPaymentTransactionListResponse {
  oneof result {
    Response response = 1;
    Error error = 2;
  }

  message Response {
    repeated PaymentTransactionDetail transactions = 1;
    // Absent on the last page. There is no total: counting every matching row costs a second pass
    // over the same data, and cursor paging does not need one - page until this stops coming back.
    optional string next_cursor = 2;
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      NOT_FOUND = 1;
      // Also covers a window reaching outside the three completed calendar days, and a cursor sent
      // back with a different filter. The message names the window that was allowed.
      INVALID_ARGUMENT = 2;
    }
  }
}

// One row of Kody Universe > Sales > Transactions > Download. Every field holds the same value as
// the CSV column named in its comment, for the same store and window; field order follows the file.
//
// Amounts are decimal strings with 2 decimal places ("12.34"), never floating point. A refund's
// amounts are negative, as they are in the file.
message PaymentTransactionDetail {
  string store_name = 1;                      // Store Name: display name of the store
  string store_id = 2;                        // Store Id: the store that was requested
  // Payment Type: entry mode or channel, e.g. "Card Present", and " (Pre-auth)" is appended for a
  // deposit flow. Free text rather than an enum because the set of channels grows and the suffix
  // rides along with it; compare it as a string.
  string payment_type = 3;
  TransactionType transaction_type = 4;       // Transaction Type
  TransactionStatus status = 5;               // Status
  // Transaction Date: when the transaction happened, as an instant. The file prints this in the
  // store's timezone ("Mon 21 Sep 2026 04:34:53"); render it in that timezone to get the same text.
  // This is also the field the filter selects on.
  google.protobuf.Timestamp transaction_date = 6;
  // Tender Reference: absent for payment methods and outcomes that have none.
  optional string tender_reference = 7;
  string payment_reference = 8;               // Payment Reference: identifies this record
  // Auth Code. A string so leading zeros survive. The CSV writes it as '123456 - an apostrophe to
  // stop a spreadsheet reading it as a number - and that apostrophe is not part of the value here.
  optional string auth_code = 9;
  optional string batch_id = 10;              // Batch ID. A string, and no leading apostrophe, as above.
  optional string terminal_id = 11;           // Terminal ID, where a terminal was involved
  // Payment Method: scheme or wallet, e.g. Visa, Mastercard, Alipay. Free text for the same reason
  // as payment_type - new wallets appear without a contract change.
  string payment_method = 12;
  // Payment Variant: the scheme or wallet product. "Unknown" where the variant could not be resolved,
  // which is what the file prints.
  optional string payment_variant = 13;
  optional string card_last_four_digits = 14; // A string, and no leading apostrophe, as above.

  // Sale: the sale amount with the offer added back, so sale + tip - |offer| reconciles to total.
  string sale = 15;
  string tip = 16;                            // Tip; "0.00" when none was added
  // Offer: the discount, reported as a negative amount ("-1.50"); "0.00" when none was applied.
  string offer = 17;
  string total = 18;                          // Total, after sale, tip and offer
  string transaction_fees = 19;               // Transaction Fees: the base processing fee
  optional string instalment_fee = 20;        // Instalment Fee, where one applies
  string total_fees = 21;                     // Total Fees: every fee component that applies
  optional string no_cvv_fees = 22;           // NoCVV Fees, where they apply
  optional string three_ds_fees = 23;         // 3DS Fees, where they apply
  string net_total = 24;                      // Net Total: total less total_fees

  bool mcc_payment = 25;                      // MCC Payment (Yes/No in the file)
  bool no_cvv = 26;                           // No CVV (Yes/No in the file)
  bool three_ds = 27;                         // 3DS (Yes/No in the file)
  // Settlement Date: absent while the transaction has no settlement date yet. Reported only - the
  // filter never applies to it, whatever the window asks for.
  optional google.protobuf.Timestamp settlement_date = 28;
  TransactionRegion transaction_region = 29;  // Transaction Region
  optional string external_payment_reference = 30; // From your own system, when you supplied one
  optional string external_order_id = 31;     // From your own system, when you supplied one
  // Instalment: absent where instalments do not apply to this transaction or the answer is not
  // available, which is not the same as false (it applies, and this one is not an instalment).
  optional bool instalment = 32;
  // Instalment Period: the instalment term, as the instalment service reports it. A string, not a
  // number, because that is what the source field is and what the file prints.
  optional string instalment_period = 33;
  // RefundReference List: the refunds linked to this transaction, oldest first. Empty when none.
  repeated string refund_reference_list = 34;
  // Description (for payment link): set for a Payment Link transaction that carries one.
  optional string description_for_payment_link = 35;

  // A row is one or the other: a transaction carrying a refund reference is a Refund, everything
  // else is a Sale. A pre-auth is not a third type - it shows up as a suffix on payment_type.
  enum TransactionType {
    TRANSACTION_TYPE_UNSPECIFIED = 0;
    SALE = 1;
    REFUND = 2;
  }

  // The five values the Sales report prints. Authorised and captured both read as APPROVED; a
  // failed authorise, failed capture or cancellation all read as DECLINED.
  enum TransactionStatus {
    TRANSACTION_STATUS_UNSPECIFIED = 0;
    APPROVED = 1;
    DECLINED = 2;
    REFUNDED = 3;
    FAILED_REFUND = 4;
    PENDING_REFUND = 5;
  }

  enum TransactionRegion {
    TRANSACTION_REGION_UNSPECIFIED = 0;
    DOMESTIC = 1;
    INTERNATIONAL = 2;
  }
}

message RefundRequest {
  string store_id = 1; // UUID of store
  // Refunding by psp_reference is no longer supported: removed 2026-09-05 after 90 days with no
  // request using it. A request that still sets it now carries no identifier and is rejected with
  // INVALID_ARGUMENT rather than refunding anything. Field 4 and the name stay reserved so neither
  // can be reused for something else.
  reserved 4;
  reserved "psp_reference";
  // Kept as a oneof with one member: exactly one identifier, and room for another later without
  // changing the shape of the generated code.
  oneof id {
    string payment_id = 2; // Payment id created by wombat
  }
  string amount = 3; // amount in BigDecimal/2.dp (0.00)
  optional string idempotency_uuid = 5; // Idempotency key to ensure the request is processed only once, generated by client. Without it a retry is indistinguishable from a second partial refund and is processed as one.
}
message RefundResponse {
  RefundStatus status = 1;
  optional string failure_reason = 2; // only populated on failure
  string payment_id = 3; // The payment that was refunded. Empty when the refund was requested by psp_reference.
  google.protobuf.Timestamp date_created = 4;
  string total_paid_amount = 5;
  string total_amount_refunded = 6;
  string remaining_amount = 7;
  string total_amount_requested = 8;
  string paymentTransactionId = 9; // This refund's own id — not the payment's. Use it to identify this refund; the payment is in payment_id.
  // Whether the refund REQUEST was accepted — which is all this response can say. Adyen's synchronous
  // refund response carries `status: received` and nothing more; the outcome arrives later. Read the
  // refund's own state from PaymentDetails.refunds[].status (ecom) / PayResponse.refunds[].status.
  enum RefundStatus {
    PENDING = 0;
    REQUESTED = 1;    // Accepted by the acquirer. NOT money back yet.
    FAILED = 2;       // Rejected outright.
  }
}

// Zero is VISA for historical reasons, and renumbering it would silently reinterpret the bytes of
// every client already published against this contract. Fields carrying this enum therefore use
// explicit presence (`optional`), so that an unset field is not read as a Visa card. SDKs generated
// before that presence existed cannot tell the two apart; there, `payment_method_variant` (a string,
// where empty is unambiguous) is the signal to trust.
enum PaymentMethods {
  VISA = 0;
  MASTERCARD = 1;
  AMEX = 2;
  BAN_CONTACT = 3;
  CHINA_UNION_PAY = 4;
  MAESTRO = 5;
  DINERS = 6;
  DISCOVER = 7;
  JCB = 8;
  ALIPAY = 9;
  WECHAT = 10;
  APPLE_PAY = 11;
  GOOGLE_PAY = 12;
}

// A refund's own lifecycle, which is not the payment's: the payment stays successful throughout.
// Carried only on PaymentDetails.refunds[].status — a surface that did not exist before, so there is no
// older field beside it saying something different. Nested so the values keep short names: proto enum
// values are siblings of their type within the package, and PaymentStatus already occupies PENDING,
// FAILED and CANCELLED there.
message Refund {
  enum Status {
    UNSPECIFIED = 0;  // Never sent deliberately; a legal fallback rather than an illegal one.
    PENDING = 1;      // Not yet sent to the acquirer.
    REQUESTED = 2;    // The acquirer accepted the refund request. Not yet money back.
    SUCCEEDED = 3;    // The refund completed.
    FAILED = 4;       // The acquirer rejected or failed it.
    CANCELLED = 5;    // The payment was voided instead, so the payer was never charged.
  }
}

// Frozen with respect to refunds: a refunded payment still reports SUCCESS here, because adding values
// to this field would change what every existing integrator sees. Whether a payment has been refunded,
// and by how much, is in PaymentDetails.refunds.
enum PaymentStatus {
  PENDING = 0;
  SUCCESS = 1;
  FAILED = 2;
  CANCELLED = 3;
  EXPIRED = 4;
}

message CreateTokenRequest {
  string store_id = 1; // Your Kody store id
  string idempotency_uuid = 2; // Idempotency key to ensure the request is processed only once, generated by client.
  optional string token_reference = 3; // Your unique reference for this token request, if applicable. This can be used to match the token with your internal systems.
  string payer_reference = 4; // The payer for whom the token is being created. This can be a user ID or any unique identifier you use to track users.
  optional string metadata = 5; // A data set that can be used to store information about the order and used in the tokenisation process.
  string return_url = 6; // The URL that your client application will be redirected to after the tokenisation is authorised. You can include additional query parameters, for example, the user id or order reference.
  optional string payer_statement = 7; // The text to be shown on the payer's bank statement. Maximum 22 characters, otherwise banks might truncate the string. If not set it will use the store's terminals receipt printing name. Allowed characters: a-z, A-Z, 0-9, spaces, and special characters . , ' _ - ? + * /
  optional string payer_email_address = 8; // We recommend that you provide this data, as it is used in velocity fraud checks. Required for 3D Secure 2 transactions.
  optional string payer_phone_number = 9; // We recommend that you provide this data, as it is used in velocity fraud checks. Required for 3D Secure 2 transactions.
  optional RecurringProcessingModel recurring_processing_model = 10; // The recurring model to use for the payment, if applicable. Can be 'Subscription', 'UnscheduledCardOnFile' or 'CardOnFile'.
  optional ExpirySettings expiry = 11; // Settings for tokenisation URL expiry

  message ExpirySettings {
    bool show_timer = 1; // Display a countdown timer to the user in the tokenisation page, default is false
    uint64 expiring_seconds = 2; // Timeout duration in seconds, defaults to 1800 seconds (30 minutes)
  }
}

enum RecurringProcessingModel {
  MODEL_UNSPECIFIED = 0;  // Default value, not set
  CARD_ON_FILE = 1; // Card on file model
  SUBSCRIPTION = 2; // Subscription model
  UNSCHEDULED_CARD_ON_FILE = 3; // Unscheduled card on file model
}

message CreateTokenResponse {
  oneof result {
    Response response = 1;
    Error error = 2;
  }

  message Response {
    string token_id = 1; // The unique identifier created by Kody
    string create_token_url = 2; // The URL to send the user to from your application
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      DUPLICATE_ATTEMPT = 1;
      INVALID_REQUEST = 2;
    }
  }
}

message GetCardTokenRequest {
  string store_id = 1; // Your Kody store id
  oneof token_identifier {
    string token_id = 2; // The unique identifier created by Kody
    string token_reference = 3; // Your unique payment reference that was set during the initiation
  }
}

message GetCardTokenResponse {
  oneof result {
    Response response = 1;
    Error error = 2;
  }

  message Response {
    string token_id = 1; // id from the 0 amount Ecom payment used to tokenise the stored payment method.
    optional string token_reference = 2; // the external payment reference associated with the stored payment method, if applicable
    string payment_token = 3; // Unique identifier for the stored payment method as created by Kody, e.g. a token that can be used for future payments
    string payer_reference = 4; // The payer for whom the token is created, e.g. user id or any unique identifier you use to track users
    RecurringProcessingModel recurring_processing_model = 5; // Recurring processing model
    CardTokenStatus status = 6;
    google.protobuf.Timestamp created_at = 7; // Date when the token was created
    // Explicit presence: zero is VISA, so check presence before reading. See the note on PaymentMethods.
    optional PaymentMethods payment_method = 8; // Card brand, e.g. mc, visa and so on
    string payment_method_variant = 9; // Card variant, e.g. mccredit, mcdebit, visa, visadebit, etc.
    string funding_source = 10; // Funding source of the card, e.g. CREDIT, DEBIT, PREPAID, etc. (aligns with PaymentCard.funding_source)
    string card_last_4_digits = 11; // Last four digits of the card number (aligns with PaymentCard.card_last_4_digits)
    optional string card_expiry_date = 12; // Expiry date of the tokenised card, format: MM/yyyy
  }

  enum CardTokenStatus {
    PENDING = 0;
    FAILED = 1;
    READY = 2;
    DELETED = 3;
    PENDING_DELETE = 4; // Token is in the process of being deleted
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      PENDING_CREATE = 1; // Token not yet created, still in progress
      INVALID_REQUEST = 2;
    }
  }
}

message DeleteCardTokenRequest {
  string store_id = 1; // Kody store id
  oneof token_identifier {
    string token_id = 2; // The unique identifier created by Kody
    string token_reference = 3; // Your unique payment reference that was set during the initiation
  }
}

message DeleteCardTokenResponse {
  oneof result {
    Response response = 1;
    Error error = 2;
  }

  message Response {
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      NOT_FOUND = 1; // Maps from original Status.NOT_FOUND
      FAILED = 2;    // Maps from original Status.FAILED
      INVALID_REQUEST = 3; // Adding a common error type
    }
  }
}

message GetCardTokensRequest {
  string store_id = 1;
  string payer_reference = 2; // The shopper for whom to list tokens
}

message GetCardTokensResponse {
  oneof result {
    Response response = 1;
    Error error = 2;
  }

  message Response {
    repeated GetCardTokenResponse.Response tokens = 1;
  }

  message Error {
    Type type = 1;
    string message = 2;

    enum Type {
      UNKNOWN = 0;
      INVALID_REQUEST = 1; // e.g. missing store_id or payer_reference
    }
  }
}

message PayWithCardTokenRequest {
  string store_id = 1; // Your Kody store id
  string idempotency_uuid = 2; // Idempotency key to ensure the request is processed only once, can be generated by client.
  string payment_token = 3; // The ID of the payment token to be charged
  uint64 amount_minor_units = 4; // Amount in minor units. For example, 2000 means GBP 20.00.
  string currency = 5; // ISO 4217 three letter currency code
  string payment_reference = 6; // Your unique reference for this payment
  optional string order_id = 7; // Your identifier for the order
  optional string order_metadata = 8; // Optional order details, not yet implemented.
  optional string payer_statement = 9; // Optional text for payer's bank statement
  optional PaymentInitiationRequest.CaptureOptions capture_options = 10 [deprecated=true]; // Deprecated: capture/release options are no longer supported.
}
